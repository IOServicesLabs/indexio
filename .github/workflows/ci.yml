name: ci

# Quick checks only, never longer than 90 seconds: the manifests parse, the
# scripts compile, the workflows are valid YAML. The full build and test
# suite run locally (`cargo test --workspace`) and are too slow for this
# budget on a shared runner.

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4

      - name: Check (90 s hard limit)
        run: |
          timeout --signal=KILL 90 bash -eo pipefail -c '
            cargo metadata --no-deps --format-version 1 > /dev/null
            python3 -m py_compile bench/*.py tools/*.py
            bash -n install.sh tools/*.sh
            node --check npm/install.js npm/bin/indexio.js
            node -e "JSON.parse(require(\"fs\").readFileSync(\"npm/package.json\"))"
            for f in .github/workflows/*.yml docker-compose.yml; do
              python3 -c "import sys, yaml; yaml.safe_load(open(sys.argv[1]))" "$f" 2>/dev/null \
                || ruby -ryaml -e "YAML.load_file(ARGV[0])" "$f"
            done
            echo ok
          '
