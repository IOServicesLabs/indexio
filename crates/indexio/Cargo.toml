[package]
name = "indexio"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true
description = "Code search, impact analysis and MCP server for AI coding agents"

[[bin]]
name = "indexio"
path = "src/main.rs"

[dependencies]
indexio-types = { workspace = true }
indexio-core = { workspace = true }
indexio-index = { workspace = true }
indexio-ingest = { workspace = true }
indexio-query = { workspace = true }
indexio-embed = { workspace = true }
indexio-symbols = { workspace = true }
notify = "8.2"
clap = { workspace = true }
axum = { workspace = true }
tokio = { workspace = true }
tower-http = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
regex = { workspace = true }
rayon = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
ureq = { version = "2", features = ["json"] }
jsonwebtoken = { version = "10", features = ["rust_crypto"] }

dhat = { version = "0.3", optional = true }
mimalloc = { version = "0.1", optional = true, default-features = false }

[features]
# heap accounting for memory work: see src/memstat.rs
memstat = []
# heap profile with call stacks, written at exit (implies slow allocation)
dhat-heap = ["dep:dhat"]
# experiment: mimalloc instead of the system allocator (with `memstat`, the
# counted allocator is mimalloc)
mimalloc = ["dep:mimalloc"]

[dev-dependencies]
tempfile = "3"
