[workspace]
resolver = "2"
members = [
    "crates/indexio-types",
    "crates/indexio-core",
    "crates/indexio-index",
    "crates/indexio-symbols",
    "crates/indexio-ingest",
    "crates/indexio-query",
    "crates/indexio",
    "crates/indexio-embed",
]

[workspace.package]
version = "0.1.2"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/IOServicesLabs/indexio"
homepage = "https://github.com/IOServicesLabs/indexio"
rust-version = "1.85"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bincode = "1.3"
thiserror = "2"
anyhow = "1"
byteorder = "1"
memmap2 = "0.9"
zstd = "0.13"
fst = "0.4"
roaring = "0.10"
aho-corasick = "1"
memchr = "2"
regex = "1"
blake3 = "1"
rayon = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
gix = { version = "0.66", default-features = false, features = ["parallel", "serde"] }
tree-sitter = "0.24"
clap = { version = "4", features = ["derive"] }
axum = "0.8"
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.6", features = ["cors", "trace"] }
ulid = { version = "1", features = ["serde"] }
base64 = "0.22"
indexio-types = { path = "crates/indexio-types" }
indexio-core = { path = "crates/indexio-core" }
indexio-index = { path = "crates/indexio-index" }
indexio-symbols = { path = "crates/indexio-symbols" }
indexio-ingest = { path = "crates/indexio-ingest" }
indexio-query = { path = "crates/indexio-query" }
indexio-embed = { path = "crates/indexio-embed" }

[profile.release]
lto = "thin"
codegen-units = 1
