[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "indexio-cli"
version = "0.0.0"
description = "Code search, impact analysis and MCP server for AI coding agents (the indexio binary, packaged for pip)"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.8"
keywords = ["code-search", "mcp", "model-context-protocol", "claude-code", "impact-analysis"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: OS Independent",
  "Programming Language :: Rust",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development",
]

[project.urls]
Homepage = "https://github.com/IOServicesLabs/indexio"
Repository = "https://github.com/IOServicesLabs/indexio"
Changelog = "https://github.com/IOServicesLabs/indexio/releases"

[project.scripts]
indexio = "indexio_cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/indexio_cli"]
# the binary is copied in by the release workflow and is git-ignored
artifacts = ["src/indexio_cli/bin/*"]

[tool.hatch.build.targets.sdist]
exclude = ["src/indexio_cli/bin"]
